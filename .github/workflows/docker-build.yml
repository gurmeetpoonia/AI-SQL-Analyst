name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        run: |
          docker build \
          -t ai-sql-backend \
          -f backend/Dockerfile.prod \
          backend

      - name: Build Frontend
        run: |
          docker build \
          -t ai-sql-frontend \
          -f frontend/Dockerfile.prod \
          frontend