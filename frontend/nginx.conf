server {
    listen 80;
    server_name aisqlanalyst.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name aisqlanalyst.ddns.net;

    ssl_certificate /etc/letsencrypt/live/aisqlanalyst.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisqlanalyst.ddns.net/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;


    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }


    # FastAPI
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Grafana
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://ai-sql-grafana:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-Forwarded-Prefix /grafana;

        proxy_redirect off;
    }
}